<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>DeForrest Compendium</title>
  <link rel="stylesheet" href="styles.css">
</head>


<div aria-label="Toolboxes" class="tb-dock" role="toolbar">
  <span class="Brandmark">DeForrest</span>
  <button class="ToolboxButton" data-act="Toolbox-Toggle" data-tb="Toolbox-Search" title="Show or hide the Search Toolbox" type="button">
    Search
  </button>
  <button class="ToolboxButton" data-act="Toolbox-Toggle" data-tb="Toolbox-Contents" title="Show or hide the Contents Toolbox" type="button">
    Contents
  </button>
  <button class="ToolboxButton" data-act="Toolbox-Toggle" data-tb="Toolbox-Tools" title="Show or hide the Library Toolbox" type="button">
    Library
  </button>
</div>
